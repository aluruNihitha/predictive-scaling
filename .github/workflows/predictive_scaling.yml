name: AI-Powered Predictive Scaling

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  predictive-autoscaling:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install numpy pandas scikit-learn kubernetes
        
    - name: Run prediction model
      run: python predict_cpu.py
      
    - name: Execute autoscaling
      run: python auto_scale_k8s.py
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}  # Kubernetes config secret
        
    - name: Verify scaling
      run: |
        echo "Scaling operation completed"
        kubectl get deployments
        kubectl get pods
